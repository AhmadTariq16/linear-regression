[project]
name = "linear-regression"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Ahmad Tariq", email = "ahmad16_tariq@hotmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "joblib>=1.4.2",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "pydantic>=2.9.0",
    "scikit-learn>=1.9.0",
    "uvicorn>=0.34.0",
]

[project.scripts]
linear-regression = "linear_regression:main"
train = "linear_regression.training.train:main"
serve = "linear_regression.serving.app:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
